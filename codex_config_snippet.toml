# Hermes Reflection MCP v19.2.0 for Codex Desktop.
# Local stdio server exposing 28 implemented tools. Lifecycle hooks and
# session-turn capture require explicit client calls; they are not automatic.
# The server emits instructions during MCP initialize, so the config-level
# instructions field is optional. Do not auto-approve clear_data.

[mcp_servers.hermes-reflection]
type = "stdio"
command = "node"
args = ['C:\Users\<YOU>\.codex\mcp\hermes-reflection-mcp\dist\index.js']
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 300

[mcp_servers.hermes-reflection.tools.retrieve_heuristics]
approval_mode = "auto"

[mcp_servers.hermes-reflection.tools.search_reflections]
approval_mode = "auto"

[mcp_servers.hermes-reflection.tools.list_reflections]
approval_mode = "auto"

[mcp_servers.hermes-reflection.tools.get_recent_reflections]
approval_mode = "auto"

[mcp_servers.hermes-reflection.tools.get_open_questions]
approval_mode = "auto"

[mcp_servers.hermes-reflection.tools.search_heuristics]
approval_mode = "auto"

[mcp_servers.hermes-reflection.tools.list_heuristics]
approval_mode = "auto"

[mcp_servers.hermes-reflection.tools.memory_board_read]
approval_mode = "auto"

[mcp_servers.hermes-reflection.tools.user_profile_read]
approval_mode = "auto"

[mcp_servers.hermes-reflection.tools.search_sessions]
approval_mode = "auto"

[mcp_servers.hermes-reflection.tools.scroll_session_context]
approval_mode = "auto"

[mcp_servers.hermes-reflection.tools.scan_memory_threats]
approval_mode = "auto"

[mcp_servers.hermes-reflection.tools.compact_session_context]
approval_mode = "auto"

[mcp_servers.hermes-reflection.tools.list_pending_mutations]
approval_mode = "auto"
