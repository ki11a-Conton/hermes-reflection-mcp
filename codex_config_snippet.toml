# scan_memory_threats, scroll_session_context, trigger_background_review,
# list_pending_mutations, approve_pending_mutation, compact_session_context
#
# Administrative/destructive subset (never auto-approve):
# delete_heuristic, import_data, clear_data, approve_pending_mutation
