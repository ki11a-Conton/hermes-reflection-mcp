name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [20, 22]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Strict typecheck
        run: npm run test:strict

      - name: Build
        run: npm run build

      - name: Smoke test
        run: node scripts/smoke.mjs

      - name: Base regressions
        run: npm run test:regressions

      - name: v22 portable lifecycle and learning core
        run: npm run test:v22

      - name: v21 lifecycle, transaction, safety, and release suites
        run: npm run test:v21

      - name: Single and cross-process concurrency
        run: npm run test:concurrency

      - name: Verify package allow-list
        run: npm pack --dry-run --json

      - name: Audit production dependencies
        run: npm audit --omit=dev
